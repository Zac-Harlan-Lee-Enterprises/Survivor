# CI — runs on every pull request and on pushes to main.
# The job name "build-and-test" is the required status check for branch
# protection (see harden-github.sh). Keep the name in sync.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      VITE_DATA_MODE: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, architecture and API tests
        run: npm test

      - name: Bundle Lambda handlers
        run: npm run api:build

      - name: Build static site (repository subpath, same as Pages)
        run: npm run build

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end (GitHub Pages parity server, demo mode, a11y)
        run: npm run test:e2e

      - name: Harness quality sweep
        run: |
          bash scripts/install-hooks.sh
          bash quality-sweep.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
